name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.2.3 or 1.2.3). Must match package.json "version". Pre-release versions (e.g. 3.0.0-alpha.1) are published under the "next" dist-tag and marked as a GitHub pre-release.'
        required: true
        type: string
      dry_run:
        description: 'Dry run (does not publish to npm or create a GitHub release)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: yarn

      - name: Update npm for OIDC trusted publishing
        run: npm install --global npm@latest

      - name: Verify version matches package.json
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          NORMALIZED_INPUT="${INPUT_VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$NORMALIZED_INPUT" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: input version '${INPUT_VERSION}' does not match package.json version '${PKG_VERSION}'"
            exit 1
          fi

          echo "Version check passed: ${PKG_VERSION}"
          echo "RELEASE_TAG=v${PKG_VERSION}" >> "$GITHUB_ENV"

          # Pre-release versions (e.g. 3.0.0-alpha.1) go to the "next" dist-tag
          # so "npm install @xahau/hooks-cli" keeps resolving to the stable release.
          if [[ "$PKG_VERSION" == *-* ]]; then
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
            echo "GH_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
            echo "GH_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn run build

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --tag "$NPM_TAG" --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --tag "$NPM_TAG"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--title "${RELEASE_TAG}" --generate-notes --target "${{ github.sha }}")
          if [ "$GH_PRERELEASE" = true ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${ARGS[@]}"
